{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h1>Login</h1>
<form method="post">{% csrf_token %}{{ form|crispy }}<button class="btn btn-primary">Login</button></form>
<p class="mt-3"><a href="{% url 'accounts:password_reset' %}">Forgot password?</a> · <a href="{% url 'accounts:register' %}">Register</a></p>
</div></div>
{% endblock %}
