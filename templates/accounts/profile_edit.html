{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="mb-6">
    <p class="eyebrow mb-2">Account</p>
    <h1 class="page-title">Edit Profile</h1>
    <p class="mt-2 text-slate-500">Update your public profile information.</p>
  </div>
  <form method="post" enctype="multipart/form-data" class="card-modern space-y-5 p-6">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="flex flex-wrap items-center justify-end gap-3 border-t border-slate-100 pt-5">
      <a href="{% url 'accounts:profile' %}" class="btn-ghost">Cancel</a>
      <button type="submit" class="btn-primary">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
