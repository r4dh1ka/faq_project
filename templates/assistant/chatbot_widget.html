<div id="yaksha-chatbot">
  <button id="chatbot-toggle" class="chatbot-fab" aria-label="Open FAQ Assistant">
    <i class="bi bi-robot"></i>
  </button>

  <div id="chatbot-panel" class="chatbot-panel hidden">
    <div class="chatbot-header">
      <div class="flex items-center gap-3">
        <span class="grid h-9 w-9 place-items-center rounded-full bg-indigo-600 text-white text-sm shadow-sm">
          <i class="bi bi-robot"></i>
        </span>
        <div>
          <p class="text-sm font-bold text-slate-900">Yaksha</p>
          <p class="text-xs text-slate-500">FAQ AI Assistant</p>
        </div>
      </div>
      <button id="chatbot-close" class="icon-btn" aria-label="Close chatbot">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div id="chatbot-messages" class="chatbot-messages"></div>

    <div id="chatbot-suggestions" class="chatbot-suggestions"></div>

    <form id="chatbot-form" class="chatbot-input-row">
      {% csrf_token %}
      <input type="text" id="chatbot-input" placeholder="Ask anything…" autocomplete="off">
      <button type="submit" class="btn-primary" style="min-height:2.25rem;padding:0 0.875rem;">
        <i class="bi bi-send"></i>
      </button>
    </form>
  </div>
</div>
