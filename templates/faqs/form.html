{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
  <div class="mb-6">
    <p class="eyebrow mb-2">Contribution</p>
    <h1 class="page-title">{{ title }}</h1>
    <p class="mt-2 text-slate-500">Submit a clear answer for moderator review.</p>
  </div>
  <form method="post" enctype="multipart/form-data" class="card-modern space-y-5 p-6">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="flex flex-wrap items-center justify-end gap-3 border-t border-slate-100 pt-5">
      <a href="{% url 'faqs:list' %}" class="btn-ghost">Cancel</a>
      <button type="submit" class="btn-primary">Submit for Review</button>
    </div>
  </form>
</div>
{% endblock %}
