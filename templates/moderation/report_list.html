{% extends 'base.html' %}
{% block title %}Reports{% endblock %}
{% block content %}
<h1>Unresolved Reports</h1>
{% for r in reports %}
<div class="card mb-2">
  <div class="card-body">
    <strong>{{ r.get_reason_display }}</strong> by {{ r.reporter.username }}
    <p>{{ r.description }}</p>
    <form method="post" action="{% url 'moderation:resolve_report' r.pk %}">{% csrf_token %}
      <input name="note" class="form-control form-control-sm mb-2" placeholder="Resolution note">
      <button class="btn btn-sm btn-success">Resolve</button>
    </form>
  </div>
</div>
{% empty %}<p>No open reports.</p>{% endfor %}
{% endblock %}
